syntax = "proto3";

option java_multiple_files = true;
option java_package = "company.vk.edu.distrib.compute.khetagab.grpc";
option java_outer_classname = "KvInternalProto";

package khetagab;

service KvInternalService {
    rpc Get(GetRequest) returns (GetResponse);
    rpc Put(PutRequest) returns (PutResponse);
    rpc Delete(DeleteRequest) returns (DeleteResponse);
}

message GetRequest {
    string key = 1;
}

message GetResponse {
    bool found = 1;
    bytes value = 2;
}

message PutRequest {
    string key = 1;
    bytes value = 2;
}

message PutResponse {
}

message DeleteRequest {
    string key = 1;
}

message DeleteResponse {
}
